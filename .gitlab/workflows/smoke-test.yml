smoke-tests:
  stage: test
  variables:
    E2E_BASE_URL: "https://csse-seng302-team700.canterbury.ac.nz/test/"
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  cache:
    key: playwright-1.61.0-linux
    paths:
      - .cache/ms-playwright/
  script:
    - dotnet restore SENG302.Api.Tests/SENG302.Api.Tests.csproj
    - dotnet build SENG302.Api.Tests/SENG302.Api.Tests.csproj --no-restore
    - pwsh SENG302.Api.Tests/bin/Debug/net10.0/playwright.ps1 install chromium
    - dotnet test SENG302.Api.Tests/SENG302.Api.Tests.csproj --filter "FullyQualifiedName~SENG302.Api.Tests.E2E" --no-build --no-restore
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SMOKE_TESTS == "true"'
    - when: never

