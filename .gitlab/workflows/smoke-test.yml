name: Nightly Smoke Test

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: dotnet restore

      - name: Build the project
        run: dotnet build --no-restore

      - name: Run all tests
        run: dotnet test SENG302.Api.Tests/SENG302.Api.Tests.csproj --no-build --verbosity normal

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results

      # - name: Notify on failure # would be cooll to have a notify on failure step
      #   if: failure()
