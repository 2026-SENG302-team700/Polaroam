smoke-tests:
  stage: test
  variables:
    E2E_BASE_URL: "https://csse-seng302-team700.canterbury.ac.nz/test/"
  script:
    - dotnet restore SENG302.Api.Tests/SENG302.Api.Tests.csproj
    - dotnet test SENG302.Api.Tests/SENG302.Api.Tests.csproj --filter "FullyQualifiedName~SENG302.Api.Tests.E2E" --no-restore
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SMOKE_TESTS == "true"'
    - when: never

notify-smoke-test-failure:
  stage: notify
  needs:
    - job: smoke-tests
      artifacts: false
  script:
    - |
      curl --fail-with-body \
        --request POST \
        --header "Content-Type: application/json" \
        --data "{\"text\":\"Overnight smoke tests failed for **$CI_PROJECT_NAME** on branch **$CI_COMMIT_REF_NAME**. See the [pipeline]($CI_PIPELINE_URL) for information\"}" \
        "$MATTERMOST_WEBHOOK_URL"
  when: on_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SMOKE_TESTS == "true"'
      when: on_failure
    - when: never
